# ============================================================================
# OFNHP leadership. Drives /leadership/.
# Source: https://ofnhp.aft.org/leadership (checked 2026-11-22)
#
# HOW IT'S ORGANIZED
#   employer → sites (worksites; leave name "" if there's only one) → units
#   Each unit has ONE chair and any number of vice_chairs. The page always
#   shows the chair first, then vice chairs in the order listed, so the
#   hierarchy can't get shuffled by accident.
#   Units show in the order listed here.
#
# A person:  { name: "...", email: "..." }   (email optional)
#   photo: (optional) headshot address from the live site's Files & Media.
#
# An OPEN seat: write   chair: open   (or list "open" under vice_chairs).
#   Open seats are collected into one "These seats need a leader" panel.
#
# ⚠ EMAILS TO CONFIRM (copied from the live page; flagged, not guessed):
#   - Rhea Hindemit: live page had "@ofhhp.org" (typo); set to @ofnhp.org below.
#   - Kristen Rohde: live link was broken (not an email link); set to krohde@ofnhp.org.
#   - Tom Stewart: live link was broken; it pointed at "stewart@ofnhp.org". Kept as typed.
#   - Spelled differently from the name, kept exactly as on the live page because
#     they may be the real mailbox names: jgardener (Gardner), rsholz (Scholz),
#     gnightswonger (Nighswonger).
#   - Dylan West uses a personal address on the live page; kept.
# ============================================================================

